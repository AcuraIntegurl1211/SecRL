name: SecRL Lite release gate

on:
  pull_request:
    branches: [repro/sql-retrieval-subtyping]
  push:
    branches: [feat/secrl-lite-milestone-4]

permissions:
  contents: read

concurrency:
  group: secrl-lite-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64-compose:
    name: linux/amd64 Compose and platform
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11.11
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-platform.txt
          python -m pip install --disable-pip-version-check --no-deps .
      - name: Platform core tests
        run: python -m unittest discover -s tests/platform -v
      - name: Frontend tests and production build
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build
      - name: Generate temporary Compose configuration
        run: |
          umask 077
          {
            printf 'SECRL_PORT=18080\n'
            printf 'SECRL_MASTER_KEY=%s\n' "$(openssl rand -hex 32)"
            printf 'SECRL_SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'SECRL_INITIAL_ADMIN_USERNAME=ciadmin\n'
            printf 'SECRL_INITIAL_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'SECRL_AGENT_SERVICE_CAPABILITY_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'SECRL_TEST_MODEL_API_KEY=%s\n' "$(openssl rand -hex 24)"
          } > .env.ci
      - name: Validate and build linux/amd64 Compose
        run: |
          docker compose -p secrlliteci --env-file .env.ci --profile smoke config --quiet
          docker compose -p secrlliteci --env-file .env.ci --profile smoke build
      - name: Start from an empty volume and wait for health
        run: docker compose -p secrlliteci --env-file .env.ci --profile smoke up -d --wait api runner web agent-service-reference
      - name: API health and Protocol-Smoke workflows
        run: |
          set -a
          . ./.env.ci
          set +a
          export SECRL_GATE_BASE_URL=http://127.0.0.1:18080
          python scripts/lite-protocol-smoke.py
      - name: Backup, restore, and tamper rejection
        run: |
          docker compose -p secrlliteci --env-file .env.ci exec -T api secrl-lite backup /tmp/release-gate-backup
          docker compose -p secrlliteci --env-file .env.ci exec -T api secrl-lite restore /tmp/release-gate-backup /tmp/release-gate-restore
          docker compose -p secrlliteci --env-file .env.ci exec -T api sh -c 'cp -a /tmp/release-gate-backup /tmp/release-gate-tampered && printf x >> /tmp/release-gate-tampered/secrl-lite.sqlite3'
          if docker compose -p secrlliteci --env-file .env.ci exec -T api secrl-lite restore /tmp/release-gate-tampered /tmp/should-not-exist; then
            echo 'tampered backup was accepted' >&2
            exit 1
          fi
      - name: Compose diagnostics
        if: always()
        run: docker compose -p secrlliteci --env-file .env.ci --profile smoke ps || true
      - name: Clean isolated Compose project
        if: always()
        run: docker compose -p secrlliteci --env-file .env.ci --profile smoke down --volumes --remove-orphans || true

  multiarch-build:
    name: linux/amd64 + linux/arm64 image build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build platform runtime without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lite/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build Web without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lite/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build reference Agent Service without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent-service-reference/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
