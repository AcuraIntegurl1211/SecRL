name: secrl-lite

x-platform-env: &platform-env
  SECRL_DATA_DIR: /data
  SECRL_MASTER_KEY: ${SECRL_MASTER_KEY:?Set SECRL_MASTER_KEY in .env}
  SECRL_SESSION_SECRET: ${SECRL_SESSION_SECRET:?Set SECRL_SESSION_SECRET in .env}
  SECRL_INITIAL_ADMIN_USERNAME: ${SECRL_INITIAL_ADMIN_USERNAME:-admin}
  SECRL_INITIAL_ADMIN_PASSWORD: ${SECRL_INITIAL_ADMIN_PASSWORD:?Set SECRL_INITIAL_ADMIN_PASSWORD in .env}
  SECRL_AGENT_SERVICE_CAPABILITY_SECRET: ${SECRL_AGENT_SERVICE_CAPABILITY_SECRET:-}
  SECRL_SECRL_RUNTIME_ENABLED: ${SECRL_SECRL_RUNTIME_ENABLED:-false}
  SECRL_SECRL_MYSQL_USER: ${SECRL_MYSQL_USER:-benchmark_ro}
  SECRL_SECRL_MYSQL_PASSWORD: ${SECRL_MYSQL_PASSWORD:-}
  SECRL_SECRL_MYSQL_DATABASE: ${SECRL_MYSQL_DATABASE:-env_monitor_db}
  SECRL_AGENT_SERVICE_ALLOWLIST: '["agent-service-reference"]'
  FORWARDED_ALLOW_IPS: "*"

x-mysql: &mysql
  image: mysql:9.0@sha256:92dc869678019f65d761155dacac660a904f6245bfe1b7997da0a73b2bfc68c9
  restart: unless-stopped
  expose: ["3306"]
  environment:
    MYSQL_ROOT_PASSWORD: ${SECRL_MYSQL_ROOT_PASSWORD:-}
    SECRL_MYSQL_USER: ${SECRL_MYSQL_USER:-benchmark_ro}
    SECRL_MYSQL_PASSWORD: ${SECRL_MYSQL_PASSWORD:-}
    SECRL_MYSQL_DATABASE: env_monitor_db
  volumes:
    - incident_data:/var/lib/mysql
    - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 10s
    timeout: 5s
    retries: 12
  cap_drop: ["ALL"]
  cap_add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
  networks:
    - incident
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 2G

services:
  web:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${SECRL_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - control
      - ingress

  api:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
      target: runtime
    environment: *platform-env
    volumes:
      - platform_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - control
      - egress

  runner:
    build:
      context: .
      dockerfile: docker/lite/Dockerfile
      target: runtime
    entrypoint: ["secrl-lite"]
    command: ["run-worker"]
    environment: *platform-env
    volumes:
      - platform_data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; connection = sqlite3.connect('/data/secrl-lite.sqlite3'); connection.execute('select 1').fetchone(); connection.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - control
      - incident
      - egress

  agent-service-reference:
    build:
      context: .
      dockerfile: docker/agent-service-reference/Dockerfile
    profiles: ["smoke", "agent-service-reference"]
    environment:
      AGENT_SERVICE_CAPABILITY_SECRET: ${SECRL_AGENT_SERVICE_CAPABILITY_SECRET:-}
    expose: ["8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - control

  smoke:
    image: curlimages/curl:8.12.1
    profiles: ["smoke"]
    depends_on:
      web:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["curl --fail http://web:8080/api/v1/health"]
    networks:
      - control

  incident-34:
    <<: *mysql
    profiles: ["incident_34", "secrl-all"]
    volumes:
      - incident_34_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-38:
    <<: *mysql
    profiles: ["incident_38", "secrl-all"]
    volumes:
      - incident_38_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-39:
    <<: *mysql
    profiles: ["incident_39", "secrl-all"]
    volumes:
      - incident_39_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-5:
    <<: *mysql
    profiles: ["incident_5", "secrl-all"]
    volumes:
      - incident_5_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-55:
    <<: *mysql
    profiles: ["incident_55", "secrl-all"]
    volumes:
      - incident_55_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-134:
    <<: *mysql
    profiles: ["incident_134", "secrl-all"]
    volumes:
      - incident_134_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-166:
    <<: *mysql
    profiles: ["incident_166", "secrl-all"]
    volumes:
      - incident_166_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro
  incident-322:
    <<: *mysql
    profiles: ["incident_322", "secrl-all"]
    volumes:
      - incident_322_data:/var/lib/mysql
      - ./docker/mysql/init-incident.sh:/docker-entrypoint-initdb.d/10-init-incident.sh:ro

volumes:
  platform_data:
  incident_data:
  incident_34_data:
  incident_38_data:
  incident_39_data:
  incident_5_data:
  incident_55_data:
  incident_134_data:
  incident_166_data:
  incident_322_data:

networks:
  control:
    internal: true
  incident:
  egress:
  ingress:
